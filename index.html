<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>画师库</title>
<style>
  :root {
    --bg: #f5f7ff;
    --card: #ffffff;
    --primary: #3b82f6;
    --text: #1f2937;
    --sub: #6b7280;
    --line: #e5e7eb;
    --shadow: 0 2px 12px rgba(59,130,246,.08);
    --topbar: #ffffff;
    --nav-bg: #ffffff;
  }
  body.dark {
    --bg: #0f1420;
    --card: #1a2233;
    --primary: #60a5fa;
    --text: #e2e8f0;
    --sub: #7c8ba1;
    --line: #263248;
    --shadow: 0 2px 12px rgba(0,0,0,.4);
    --topbar: #141b2b;
    --nav-bg: #141b2b;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }

  /* 顶部栏 */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: var(--topbar);
    border-bottom: 1px solid var(--line);
    position: sticky; top:0; z-index:50;
  }
  .topbar .logo {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 26px; cursor: pointer; user-select:none;
    padding: 4px 10px; border-radius: 10px;
    transition: background .2s;
  }
  .topbar .top-left { width:44px; display:flex; align-items:center; }
  .admin-exit-btn {
    font-size:13px; cursor:pointer; border:none; border-radius:8px;
    background: var(--primary); color:#fff; padding:6px 12px;
    white-space:nowrap;
  }
  /* 结果页返回箭头 */
  .back-btn {
    font-size:22px; cursor:pointer; border:none; background:none; color:var(--text);
    padding:2px 4px; line-height:1;
  }
  .topbar .logo {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:26px; cursor:pointer; user-select:none;
    padding:4px 10px; border-radius:10px;
    transition: background .2s, transform .2s;
  }
  /* 大号透明热区，扩大长按识别范围 */
  .logo-hotzone {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:90px; height:60px; cursor:pointer; z-index:5;
  }
  /* 长按按下时的视觉反馈 */
  .topbar .logo.pressing {
    background: var(--primary); color:#fff; transform:translateX(-50%) scale(1.15);
  }
  .theme-btn {
    font-size: 22px; cursor: pointer; border:none; background:none;
    padding: 6px; border-radius: 50%;
  }
  .theme-btn:hover { background: var(--line); }

  /* 主内容区 */
  .content { flex:1; padding: 16px; overflow-y:auto; }

  /* 更新横幅 */
  .banner {
    display:none; position: sticky; top:55px; z-index:40;
    background: var(--primary); color:#fff;
    padding: 10px 14px; font-size:14px; border-radius: 10px;
    margin-bottom: 12px; box-shadow: var(--shadow);
    animation: fadeIn .4s;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none} }

  /* 检索 */
  .search-row { display:flex; gap:8px; margin-bottom:12px; }
  .search-row input {
    flex:1; padding: 12px 14px; border-radius: 12px;
    border:1px solid var(--line); background: var(--card); color: var(--text);
    font-size:15px; outline:none;
  }
  .search-row input:focus { border-color: var(--primary); }
  .search-row button {
    padding: 0 20px; border:none; border-radius: 12px;
    background: var(--primary); color:#fff; font-size:15px; cursor:pointer;
  }
  .suggest {
    display:none; background: var(--card); border:1px solid var(--line);
    border-radius: 12px; overflow:hidden; margin-bottom:12px; box-shadow: var(--shadow);
  }
  .suggest-item {
    padding: 12px 14px; cursor:pointer; font-size:15px; border-bottom:1px solid var(--line);
  }
  .suggest-item:last-child { border-bottom:none; }
  .suggest-item:active { background: var(--line); }

  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:12px; }
  .card {
    background: var(--card); border-radius: 12px; overflow:hidden;
    box-shadow: var(--shadow); border:1px solid var(--line);
  }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; cursor:pointer; }
  .card .name { padding:8px 10px; font-size:14px; text-align:center; color:var(--text); cursor:pointer; }
  /* 管理员卡片操作按钮 */
  .card-actions { display:flex; border-top:1px solid var(--line); }
  .card-actions button {
    flex:1; padding:9px 0; border:none; font-size:13px; cursor:pointer; background:transparent;
    color:var(--sub); transition:background .2s;
  }
  .card-actions button + button { border-left:1px solid var(--line); }
  .card-actions button.edit:hover { background: var(--primary); color:#fff; }
  .card-actions button.del:hover { background:#ef4444; color:#fff; }

  .empty { text-align:center; color:var(--sub); padding:40px 0; font-size:14px; }

  /* 随机 */
  .tab-box { display:flex; flex-direction:column; align-items:center; padding-top:20px; }
  .tab-box h3 { font-size:18px; margin-bottom:16px; font-weight:600; }
  .rand-row { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .rand-row input {
    width:80px; padding:10px; text-align:center; font-size:16px;
    border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text);
  }
  .rand-row button {
    width:52px; height:44px; font-size:20px; border:none; border-radius:12px;
    background: var(--primary); color:#fff; cursor:pointer;
  }
  .rand-result {
    background: var(--card); border:1px solid var(--line); border-radius:12px;
    padding:20px; width:100%; min-height:80px; text-align:center;
    font-size:16px; line-height:1.8; word-break:break-all; box-shadow: var(--shadow);
  }
  .copy-btn {
    margin-top:14px; padding:10px 28px; border:none; border-radius:12px;
    background: var(--primary); color:#fff; font-size:15px; cursor:pointer;
  }

  /* 统计 */
  .stat-box { text-align:center; padding-top:30px; }
  .stat-num { font-size:64px; font-weight:800; color: var(--primary); }
  .stat-label { color: var(--sub); margin:8px 0 30px; }
  .stat-section { text-align:left; background: var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; box-shadow: var(--shadow); }
  .stat-section h4 { font-size:15px; margin-bottom:10px; color: var(--sub); }
  .stat-tags { display:flex; flex-wrap:wrap; gap:8px; }
  .stat-tag { background: var(--line); color: var(--text); font-size:13px; padding:5px 10px; border-radius:8px; }

  /* 上传表单 / 管理员 */
  .admin-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:100; align-items:center; justify-content:center; padding:20px;
  }
  .admin-overlay.show { display:flex; }
  .admin-panel {
    background: var(--card); border-radius:16px; padding:24px; width:100%; max-width:360px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
  }
  .admin-panel h3 { margin-bottom:16px; font-size:17px; text-align:center; }
  .admin-panel input {
    width:100%; padding:11px 12px; margin-bottom:12px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text);
    font-size:15px; outline:none;
  }
  .admin-panel input:focus { border-color: var(--primary); }
  .admin-panel .file-label {
    display:block; padding:11px 12px; margin-bottom:12px; text-align:center;
    border:1px dashed var(--primary); border-radius:10px; color:var(--primary);
    cursor:pointer; font-size:14px;
  }
  .admin-panel .btn {
    width:100%; padding:12px; border:none; border-radius:10px;
    background: var(--primary); color:#fff; font-size:15px; cursor:pointer; margin-top:4px;
  }
  .admin-panel .btn.secondary { background: var(--line); color: var(--text); margin-top:8px; }
  .admin-panel .msg { font-size:13px; text-align:center; margin-top:10px; min-height:18px; color: var(--sub); }
  .admin-panel .msg.err { color:#ef4444; }
  .admin-panel .msg.ok { color:#22c55e; }
  .admin-panel .author-note { text-align:center; color: var(--sub); font-size:13px; margin-bottom:10px; }

  /* 画师详情页 */
  .detail-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.92);
    z-index:90; align-items:center; justify-content:center; padding:16px;
    flex-direction:column;
  }
  .detail-overlay.show { display:flex; }
  .detail-img {
    max-width:100%; max-height:70vh; border-radius:12px; object-fit:contain;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .detail-name {
    margin-top:16px; color:#fff; font-size:20px; font-weight:600; text-align:center;
    word-break:break-all; max-width:100%; cursor:pointer;
    border:1px dashed rgba(255,255,255,.3); padding:10px 16px; border-radius:10px;
  }
  .detail-name .copy-hint { font-size:12px; color:rgba(255,255,255,.5); font-weight:400; }
  .detail-copy {
    margin-top:8px; padding:10px 32px; border:none; border-radius:10px;
    background: var(--primary); color:#fff; font-size:15px; cursor:pointer;
  }
  .detail-close {
    position:absolute; top:16px; right:20px; font-size:30px; color:#fff;
    cursor:pointer; background:none; border:none; line-height:1;
  }

  /* 编辑弹窗 */
  .edit-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:110; align-items:center; justify-content:center; padding:20px;
  }
  .edit-overlay.show { display:flex; }
  .edit-panel {
    background: var(--card); border-radius:16px; padding:24px; width:100%; max-width:360px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
  }
  .edit-panel h3 { margin-bottom:6px; font-size:17px; text-align:center; }
  .edit-panel .edit-old { text-align:center; color:var(--sub); font-size:13px; margin-bottom:14px; word-break:break-all; }
  .edit-panel input {
    width:100%; padding:11px 12px; margin-bottom:12px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text);
    font-size:15px; outline:none;
  }
  .edit-panel input:focus { border-color: var(--primary); }
  .edit-panel .file-label {
    display:block; padding:11px 12px; margin-bottom:12px; text-align:center;
    border:1px dashed var(--primary); border-radius:10px; color:var(--primary);
    cursor:pointer; font-size:14px;
  }
  .edit-panel .btn-row { display:flex; gap:10px; margin-top:4px; }
  .edit-panel .btn { flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; cursor:pointer; }
  .edit-panel .btn.save { background: var(--primary); color:#fff; }
  .edit-panel .btn.cancel { background: var(--line); color: var(--text); }
  .edit-panel .msg { font-size:13px; text-align:center; margin-top:10px; min-height:18px; color: var(--sub); }
  .edit-panel .msg.err { color:#ef4444; }
  .edit-panel .msg.ok { color:#22c55e; }

  /* 管理员上传区块（主界面底部） */
  .admin-upload {
    margin:18px 4px 8px; padding:16px;
    border:1px dashed var(--primary); border-radius:14px;
    background: var(--card);
  }
  .admin-upload-title {
    text-align:center; font-weight:600; font-size:15px; margin-bottom:12px;
    color: var(--primary);
  }
  .admin-upload input[type=text] {
    width:100%; padding:11px 12px; margin-bottom:12px;
    border:1px solid var(--line); border-radius:10px;
    background: var(--bg); color: var(--text); font-size:15px; outline:none;
    box-sizing:border-box;
  }
  .admin-upload input[type=text]:focus { border-color: var(--primary); }
  .admin-upload .file-label {
    display:block; padding:11px 12px; margin-bottom:12px; text-align:center;
    border:1px dashed var(--primary); border-radius:10px; color:var(--primary);
    cursor:pointer; font-size:14px;
  }
  .admin-upload .msg { font-size:13px; text-align:center; margin-top:10px; min-height:18px; color: var(--sub); }
  .admin-upload .msg.err { color:#ef4444; }
  .admin-upload .msg.ok { color:#22c55e; }

  /* 搜索结果页头部 */
  .res-head {
    margin-bottom:12px; padding:10px 4px;
    font-size:14px; color:var(--sub);
  }
  .res-count { font-weight:600; color:var(--text); }

  /* 搜索记录 */
  .history-box {
    margin-top:16px; padding:14px;
    background: var(--card); border:1px solid var(--line);
    border-radius:12px; box-shadow: var(--shadow);
  }
  .history-title {
    display:flex; align-items:center; justify-content:space-between;
    font-size:14px; color:var(--sub); margin-bottom:10px;
  }
  .history-clear {
    border:none; background:none; color:var(--primary); font-size:13px; cursor:pointer;
  }
  .history-tags { display:flex; flex-wrap:wrap; gap:8px; }
  .history-tag {
    padding:6px 12px; border-radius:20px; font-size:13px;
    background: var(--bg); border:1px solid var(--line); color:var(--text);
    cursor:pointer; transition:background .2s;
  }
  .history-tag:active { background: var(--primary); color:#fff; }

  /* 底部导航 */
  .bottom-nav {
    display:flex; background: var(--nav-bg);
    border-top:1px solid var(--line); padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    position: sticky; bottom:0; z-index:50;
  }
  .nav-item {
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:6px 0; cursor:pointer; color:var(--sub); font-size:12px;
    transition:color .2s; user-select:none;
  }
  .nav-item .ico { font-size:22px; margin-bottom:2px; }
  .nav-item.active { color: var(--primary); }
  .nav-sign { text-align:center; color: var(--sub); font-size:12px; padding:4px 0 8px; background: var(--nav-bg); border-top:1px solid var(--line); }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <span class="top-left" id="topLeft"></span>
  <span class="logo" id="logo">🕊<span class="logo-hotzone" id="logoHot"></span></span>
  <button class="theme-btn" id="themeBtn" title="切换日夜">🌙</button>
</div>

<!-- 更新横幅 -->
<div class="banner" id="banner"></div>

<!-- 内容区 -->
<div class="content" id="content"></div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <div class="nav-item active" data-tab="search"><span class="ico">🔍</span>检索</div>
  <div class="nav-item" data-tab="random"><span class="ico">🎲</span>随机</div>
  <div class="nav-item" data-tab="stat"><span class="ico">📊</span>统计</div>
</div>
<div class="nav-sign" id="navSign"></div>

<!-- 画师详情页 -->
<div class="detail-overlay" id="detailOverlay">
  <button class="detail-close" id="detailClose">×</button>
  <img class="detail-img" id="detailImg" alt="">
  <div class="detail-name" id="detailName" title="点击复制">
    <span id="detailNameText"></span>
    <span class="copy-hint">（点击复制）</span>
  </div>
  <button class="detail-copy" id="detailCopy">📋 一键复制</button>
</div>

<!-- 编辑画师弹窗 -->
<div class="edit-overlay" id="editOverlay">
  <div class="edit-panel">
    <h3>修改画师</h3>
    <div class="edit-old" id="editOld"></div>
    <input type="text" id="editName" placeholder="画师名">
    <label class="file-label" for="editFile">📷 更换效果图（可选）</label>
    <input type="file" id="editFile" accept="image/*" style="display:none">
    <div class="btn-row">
      <button class="btn save" id="editSaveBtn">保存</button>
      <button class="btn cancel" id="editCancelBtn">取消</button>
    </div>
    <div class="msg" id="editMsg"></div>
  </div>
</div>

<!-- 管理员登录弹窗（仅验证密码用，验证通过即关闭回到主界面） -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel" id="adminPanel">
    <h3>管理员验证</h3>
    <div id="loginArea">
      <input type="password" id="adminKey" placeholder="输入密钥" autocomplete="off">
      <button class="btn" id="verifyBtn">验证</button>
    </div>
    <div class="msg" id="adminMsg"></div>
  </div>
</div>

<script>
// ============ 配置 ============
const SUPABASE_URL = 'https://tfeehgkhtaxznfbecwvh.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmZWVoZ2todGF4em5mYmVjd3ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDkyNzMsImV4cCI6MjEwMjcyNTI3M30.gAh1UT6sh3o_eB719aO1kzxdkRR0enoaRMmhz7ZZwTE';
const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmZWVoZ2todGF4em5mYmVjd3ZoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzE0OTI3MywiZXhwIjoyMTAyNzI1MjczfQ.4g8OWHlrMhQkI77u28g6u1BFbm9qW0BO4dj99IGQEQs';
const BUCKET = 'artist-images';
const ADMIN_KEY = 'LanCheng#1025'; // 管理员密钥
const AUTHOR = '蓝丞';
// ============================

let artists = [];
let tab = 'search';
let view = 'search'; // search=主页搜索 / results=搜索结果页
let lastQuery = '';
let isAdmin = false;
let editingTarget = null;

const $ = id => document.getElementById(id);

// ---- Supabase 客户端（用 fetch 直接调 REST）----
async function sbGet(path) {
  const r = await fetch(SUPABASE_URL + path, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } });
  if (!r.ok) throw new Error('读取失败 ' + r.status);
  return r.json();
}
async function sbPost(path, body, useService) {
  const key = useService ? SERVICE_KEY : ANON_KEY;
  const r = await fetch(SUPABASE_URL + path, {
    method: 'POST',
    headers: { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('写入失败 ' + r.status);
  return r;
}
async function sbDelete(path, useService) {
  const key = useService ? SERVICE_KEY : ANON_KEY;
  const r = await fetch(SUPABASE_URL + path, {
    method: 'DELETE',
    headers: { apikey: key, Authorization: 'Bearer ' + key }
  });
  if (!r.ok) throw new Error('删除失败 ' + r.status);
  return r;
}

// ---- 加载数据 ----
async function loadArtists() {
  try {
    const data = await sbGet('/rest/v1/artists?select=id,name,image_url,created_at&order=created_at.asc');
    artists = data;
    renderNavSign();
    checkNew();
  } catch(e) { console.error(e); }
}

// ---- 底部署名 ----
function renderNavSign() {
  $('navSign').textContent = AUTHOR + ' · 共 ' + artists.length + ' 位画师';
}

// ---- 顶栏左上角（管理员退出按钮）----
function renderTopLeft() {
  const tl = $('topLeft');
  let html = '';
  if (tab === 'search' && view === 'results') {
    // 搜索结果页：返回箭头
    html = '<button class="back-btn" id="backBtn">←</button>';
  } else if (isAdmin) {
    // 管理员模式：退出管理
    html = '<button class="admin-exit-btn" id="adminExitTop">退出管理</button>';
  }
  tl.innerHTML = html;
  if (html.includes('backBtn')) {
    $('backBtn').onclick = () => { backToSearch(); };
  } else if (html.includes('adminExitTop')) {
    $('adminExitTop').onclick = () => {
      isAdmin = false;
      renderTopLeft();
      render();
      showBanner('已退出管理员模式');
    };
  }
}

// 从结果页返回搜索主页
function backToSearch() {
  view = 'search';
  render();
}
function showBanner(msg) {
  const b = $('banner');
  b.textContent = msg;
  b.style.display = 'block';
  setTimeout(() => b.style.display = 'none', 3000);
}

// ---- 更新提示 ----
function checkNew() {
  const last = localStorage.getItem('lastCount');
  const cur = artists.length;
  if (last !== null) {
    const added = cur - parseInt(last);
    if (added > 0) {
      const newest = artists.slice(-Math.min(3, added)).map(a => a.name).join('、');
      const b = $('banner');
      b.textContent = '📢 新增 ' + added + ' 位画师：' + newest;
      b.style.display = 'block';
      setTimeout(() => b.style.display = 'none', 5000);
    }
  }
  localStorage.setItem('lastCount', cur);
}

// ---- Tab 切换 ----
function render() {
  const c = $('content');
  if (tab === 'search' && view === 'results') {
    // 搜索结果页：独立渲染（带返回 + 全部结果）
    c.innerHTML = resultsHTML();
    renderGrid($('grid'), lastResults);
    renderTopLeft();
    return;
  }
  if (tab === 'search') c.innerHTML = searchHTML();
  else if (tab === 'random') c.innerHTML = randomHTML();
  else if (tab === 'stat') c.innerHTML = statHTML();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'search') initSearch();
  if (tab === 'random') initRandom();
  renderTopLeft();
}

let lastResults = []; // 保存搜索结果

// ---- 搜索结果页 ----
function resultsHTML() {
  const count = lastResults.length;
  return `
    <div class="res-head">
      <span class="res-count">「${lastQuery}」共 ${count} 位画师</span>
    </div>
    <div class="grid" id="grid"></div>
  `;
}

// ---- 搜索记录 ----
const HISTORY_KEY = 'dzmm_search_history';
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; }
}
function addHistory(q) {
  if (!q) return;
  let h = getHistory().filter(x => x.toLowerCase() !== q.toLowerCase());
  h.unshift(q);
  h = h.slice(0, 10);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}
function historyHTML() {
  const h = getHistory();
  if (!h.length) return '';
  return `
    <div class="history-box">
      <div class="history-title">🕘 搜索记录
        <button class="history-clear" id="clearHistory">清空</button>
      </div>
      <div class="history-tags">
        ${h.map(x => `<span class="history-tag" data-q="${x.replace(/"/g,'&quot;')}">${x}</span>`).join('')}
      </div>
    </div>
  `;
}

// ---- 检索 Tab ----
function searchHTML() {
  return `
    <div class="search-row">
      <input id="searchInput" placeholder="输入画师名检索..." autocomplete="off">
      <button id="searchBtn">搜索</button>
    </div>
    <div class="suggest" id="suggest"></div>
    <div class="grid" id="grid"><div class="empty">输入关键词或点击搜索</div></div>
    ${historyHTML()}
    ${isAdmin ? `
    <div class="admin-upload" id="adminUpload">
      <div class="admin-upload-title">＋ 上传新画师</div>
      <input type="text" id="upName" placeholder="画师名" autocomplete="off">
      <label class="file-label" for="upFile">📷 选择效果图</label>
      <input type="file" id="upFile" accept="image/*" style="display:none">
      <button class="btn" id="uploadBtn" style="width:100%;margin-top:4px;">上传画师</button>
      <div class="msg" id="uploadMsg"></div>
    </div>` : ''}
  `;
}
function initSearch() {
  const input = $('searchInput');
  const suggest = $('suggest');

  // 历史记录点击 / 清空
  const clearBtn = $('clearHistory');
  if (clearBtn) clearBtn.onclick = () => { localStorage.removeItem(HISTORY_KEY); render(); };
  document.querySelectorAll('.history-tag').forEach(t => {
    t.onclick = () => { const q = t.dataset.q; doSearch(q); };
  });

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    const matches = q ? artists.filter(a => a.name.toLowerCase().includes(q)) : [];
    suggest.innerHTML = '';
    if (q && matches.length) {
      suggest.style.display = 'block';
      matches.slice(0, 10).forEach(a => {
        const d = document.createElement('div');
        d.className = 'suggest-item';
        d.textContent = a.name;
        d.onclick = () => { input.value = a.name; suggest.style.display = 'none'; doSearch(a.name); };
        suggest.appendChild(d);
      });
    } else {
      suggest.style.display = 'none';
    }
  });
  input.addEventListener('blur', () => setTimeout(() => suggest.style.display = 'none', 200));
  $('searchBtn').onclick = () => {
    const q = input.value.trim();
    if (q) { suggest.style.display = 'none'; doSearch(q); }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = input.value.trim();
      if (q) { suggest.style.display = 'none'; doSearch(q); }
    }
  });
}

// 执行搜索 → 进入结果页
function doSearch(q) {
  lastQuery = q;
  lastResults = q ? artists.filter(a => a.name.toLowerCase().includes(q.toLowerCase())) : [];
  addHistory(q);
  view = 'results';
  render();
}

// 渲染画师网格（通用）
function renderGrid(grid, list) {
  if (!list.length) { grid.innerHTML = '<div class="empty">未找到匹配画师</div>'; return; }
  grid.innerHTML = list.map(a => `
    <div class="card">
      <img src="${a.image_url}" alt="${a.name}" loading="lazy" referrerpolicy="no-referrer" onclick="openDetail('${a.id}')">
      <div class="name" onclick="openDetail('${a.id}')">${a.name}</div>
      ${isAdmin ? `
      <div class="card-actions">
        <button class="edit" onclick="event.stopPropagation();openEdit('${a.id}')">修改</button>
        <button class="del" onclick="event.stopPropagation();deleteArtist('${a.id}')">删除</button>
      </div>` : ''}
    </div>
  `).join('');
}

function findById(id) { return artists.find(x => String(x.id) === String(id)); }

// ---- 画师详情页 ----
function openDetail(id) {
  const a = findById(id);
  if (!a) return;
  $('detailImg').src = a.image_url;
  $('detailNameText').textContent = a.name;
  $('detailOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
$('detailClose').onclick = () => {
  $('detailOverlay').classList.remove('show');
  document.body.style.overflow = '';
};
$('detailOverlay').addEventListener('click', e => { if (e.target === $('detailOverlay')) { $('detailOverlay').classList.remove('show'); document.body.style.overflow = ''; } });

function copyText(text) {
  if (navigator.clipboard) return navigator.clipboard.writeText(text);
  return new Promise((res, rej) => {
    const t = document.createElement('textarea');
    t.value = text; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); res(); } catch(e){ rej(e); }
    t.remove();
  });
}
$('detailName').onclick = () => {
  copyText($('detailNameText').textContent).then(() => {
    const h = $('detailName').querySelector('.copy-hint');
    h.textContent = '（已复制 ✓）';
    setTimeout(() => h.textContent = '（点击复制）', 1500);
  });
};
$('detailCopy').onclick = () => {
  copyText($('detailNameText').textContent).then(() => {
    $('detailCopy').textContent = '已复制 ✓';
    setTimeout(() => $('detailCopy').textContent = '📋 一键复制', 1500);
  });
};

// ---- 编辑画师 ----
let editIdx = null;
function openEdit(id) {
  const a = findById(id);
  if (!a) return;
  editIdx = id;
  editingTarget = a;
  $('editOld').textContent = '当前：' + a.name;
  $('editName').value = a.name;
  $('editFile').value = '';
  $('editMsg').textContent = '';
  $('editMsg').className = 'msg';
  $('editOverlay').classList.add('show');
}
$('editCancelBtn').onclick = () => $('editOverlay').classList.remove('show');
$('editOverlay').addEventListener('click', e => { if (e.target === $('editOverlay')) $('editOverlay').classList.remove('show'); });

$('editSaveBtn').onclick = async () => {
  const a = editingTarget;
  const msg = $('editMsg');
  const newName = $('editName').value.trim();
  const file = $('editFile').files[0];
  if (!a) return;
  if (!newName) { msg.textContent = '画师名不能为空'; msg.className = 'msg err'; return; }

  // 重名检测（排除自己）
  const dup = artists.find(x => x.name.toLowerCase() === newName.toLowerCase() && x !== a);
  if (dup) { msg.textContent = '⚠️ 该画师名已存在'; msg.className = 'msg err'; return; }

  msg.textContent = '保存中...'; msg.className = 'msg';
  try {
    let imageUrl = a.image_url;
    // 1. 若选了新图，先上传
    if (file) {
      const safeName = 'upload_' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.jpg';
      imageUrl = await uploadImageXHR(file, safeName);
      if (!imageUrl) throw new Error('图片上传失败');
      // 删旧图（不阻断）
      try {
        const fn = a.image_url.split('/').pop();
        if (fn) await sbDelete('/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(fn), false);
      } catch(e){}
    }
    // 2. 更新记录
    await fetch(SUPABASE_URL + '/rest/v1/artists?id=eq.' + a.id, {
      method: 'PATCH',
      headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ name: newName, image_url: imageUrl })
    });
    msg.textContent = '✅ 已保存：' + newName; msg.className = 'msg ok';
    $('editOverlay').classList.remove('show');
    await loadArtists();
    render();
  } catch(e) {
    msg.textContent = '保存失败：' + e.message; msg.className = 'msg err';
  }
};

// ---- 删除画师（管理员卡片按钮版）----
async function deleteArtist(id) {
  const a = findById(id);
  if (!a) return;
  if (!confirm('确定要删除画师「' + a.name + '」吗？此操作不可恢复！')) return;
  try {
    try {
      const fn = a.image_url.split('/').pop();
      if (fn) await sbDelete('/storage/v1/object/' + BUCKET + '/' + encodeURIComponent(fn), false);
    } catch(e) {}
    await sbDelete('/rest/v1/artists?id=eq.' + a.id, false);
    showBanner('✅ 已删除：' + a.name);
    await loadArtists();
    render();
  } catch(e) {
    showBanner('删除失败：' + e.message);
  }
}

// ---- 随机 Tab ----
function randomHTML() {
  return `
    <div class="tab-box">
      <h3>🎲 随机画师串</h3>
      <div class="rand-row">
        <input type="number" id="randNum" min="1" value="3" placeholder="数量">
        <button id="randBtn">🎲</button>
      </div>
      <div class="rand-result" id="randResult">点击骰子随机抽取</div>
      <button class="copy-btn" id="copyBtn" style="display:none">复制</button>
    </div>
  `;
}
function initRandom() {
  $('randBtn').onclick = () => {
    const n = parseInt($('randNum').value);
    const result = $('randResult');
    const copy = $('copyBtn');
    if (!n || n < 1) { result.textContent = '请输入至少 1 个'; copy.style.display = 'none'; return; }
    const shuffled = [...artists].sort(() => Math.random() - 0.5);
    const picked = shuffled.slice(0, Math.min(n, shuffled.length));
    result.textContent = picked.map(a => '@' + a.name).join('，');
    result.dataset.text = result.textContent;
    copy.style.display = 'block';
  };
  $('copyBtn').onclick = () => {
    const text = $('randResult').dataset.text;
    if (!text) return;
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    $('copyBtn').textContent = '已复制 ✓';
    setTimeout(() => $('copyBtn').textContent = '复制', 1500);
  };
}

// ---- 统计 Tab ----
function statHTML() {
  const last = localStorage.getItem('lastCount');
  const added = last !== null ? artists.length - parseInt(last) : 0;
  const newest = artists.slice(-10).reverse();
  return `
    <div class="stat-box">
      <div class="stat-num">${artists.length}</div>
      <div class="stat-label">目前画师总数</div>
      <div class="stat-section">
        <h4>📢 本次打开新增</h4>
        ${added > 0 ? `<div class="stat-tags">${newest.slice(0, added).map(a => '<span class="stat-tag">' + a.name + '</span>').join('')}</div>` : '<div style="color:var(--sub)">暂无新增</div>'}
      </div>
      <div class="stat-section">
        <h4>🆕 最近新增</h4>
        <div class="stat-tags">${newest.map(a => '<span class="stat-tag">' + a.name + '</span>').join('')}</div>
      </div>
    </div>
  `;
}

// ---- 日夜切换 ----
function applyTheme() {
  const dark = localStorage.getItem('theme') === 'dark';
  document.body.classList.toggle('dark', dark);
  $('themeBtn').textContent = dark ? '☀️' : '🌙';
}
$('themeBtn').onclick = () => {
  const dark = !document.body.classList.contains('dark');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  applyTheme();
};

// ---- 隐藏入口：长按进入管理员验证 ----
let logoTimer = null;
const LOGO_HOLD_MS = 2500; // 长按 2.5 秒（原 5 秒，太慢）

function startLongPress(e) {
  e.preventDefault();
  const logo = $('logo');
  logo.classList.add('pressing'); // 按下即给视觉反馈
  // 轻震动（支持的设备）
  if (navigator.vibrate) navigator.vibrate(30);
  logoTimer = setTimeout(() => {
    openAdmin();
    clearLongPress();
  }, LOGO_HOLD_MS);
}
function clearLongPress() {
  if (logoTimer) { clearTimeout(logoTimer); logoTimer = null; }
  $('logo').classList.remove('pressing');
}
// logo 与其内部大热区共用监听（事件冒泡），扩大识别范围
const logoEl = $('logo');
logoEl.addEventListener('touchstart', startLongPress, { passive:false });
logoEl.addEventListener('mousedown', startLongPress);
logoEl.addEventListener('touchend', clearLongPress);
logoEl.addEventListener('touchmove', clearLongPress);
logoEl.addEventListener('touchcancel', clearLongPress);
logoEl.addEventListener('mouseup', clearLongPress);
logoEl.addEventListener('mouseleave', clearLongPress);

function openAdmin() {
  $('adminMsg').textContent = '';
  $('adminOverlay').classList.add('show');
  $('loginArea').style.display = 'block';
  $('adminKey').value = '';
  if (!isAdmin) setTimeout(() => $('adminKey').focus(), 100);
  bindUpload();
}
$('adminOverlay').addEventListener('click', e => { if (e.target === $('adminOverlay')) $('adminOverlay').classList.remove('show'); });

// 上传区块按钮绑定（主界面管理员模式）
function bindUpload() {
  if (!$('uploadBtn')) return;
  if ($('uploadBtn').dataset.bound) return;
  $('uploadBtn').dataset.bound = '1';
  $('uploadBtn').onclick = uploadNewArtist;
}

$('verifyBtn').onclick = () => {
  if ($('adminKey').value === ADMIN_KEY) {
    isAdmin = true;
    $('adminOverlay').classList.remove('show'); // 关闭验证弹窗，回到主界面
    $('adminMsg').textContent = '已进入管理员模式';
    $('adminMsg').className = 'msg ok';
    renderTopLeft();
    render(); // 网格显示删除/修改按钮 + 底部显示上传区块
    bindUpload();
  } else {
    $('adminMsg').textContent = '密钥错误';
    $('adminMsg').className = 'msg err';
  }
};

// ---- 上传画师（主界面管理员模式下显示）----
async function uploadNewArtist() {
  const name = $('upName').value.trim();
  const file = $('upFile').files[0];
  const msg = $('uploadMsg');
  if (!name) { msg.textContent = '请填写画师名'; msg.className = 'msg err'; return; }
  if (!file) { msg.textContent = '请选择效果图'; msg.className = 'msg err'; return; }

  // 重名检测
  const dup = artists.find(a => a.name.toLowerCase() === name.toLowerCase());
  if (dup) { msg.textContent = '⚠️ 该画师已存在：' + dup.name; msg.className = 'msg err'; return; }

  msg.textContent = '上传中...'; msg.className = 'msg';
  try {
    // 1. 用时间戳+随机数生成安全的图片文件名（存储桶不支持中文，避免InvalidKey）
    const safeName = 'upload_' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.jpg';
    // 用 FormData + XHR 上传，手机浏览器兼容性最好（fetch上传二进制在移动端易Failed to fetch）
    const imageUrl = await uploadImageXHR(file, safeName);
    if (!imageUrl) throw new Error('图片上传失败');

    // 2. 写库（用 anon key）——画师名支持中文，存在name字段
    await sbPost('/rest/v1/artists', { name, image_url: imageUrl }, false);
    msg.textContent = '✅ 上传成功：' + name; msg.className = 'msg ok';
    $('upName').value = ''; $('upFile').value = '';
    await loadArtists();
    render();
    bindUpload();
  } catch(e) {
    msg.textContent = '上传失败：' + e.message; msg.className = 'msg err';
  }
}

// 用 XMLHttpRequest 上传文件（手机兼容性最好，避免 Failed to fetch）
function uploadImageXHR(file, safeName) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const url = SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + safeName + '?upsert=true';
    xhr.open('POST', url, true);
    xhr.setRequestHeader('apikey', ANON_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + ANON_KEY);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.timeout = 60000;
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + safeName);
      } else {
        let msg = 'HTTP ' + xhr.status;
        try { const j = JSON.parse(xhr.responseText); if (j.message) msg = j.message; } catch(e){}
        reject(new Error('图片上传失败(' + msg + ')'));
      }
    };
    xhr.onerror = () => reject(new Error('网络错误(无法连接上传服务)'));
    xhr.ontimeout = () => reject(new Error('上传超时'));
    xhr.send(file);
  });
}

// ---- 初始化 ----
document.querySelectorAll('.nav-item').forEach(n => {
  n.onclick = () => {
    tab = n.dataset.tab;
    view = 'search'; // 切换 tab 时重置视图
    render();
  };
});
applyTheme();
renderTopLeft();
loadArtists();
render();
</script>
